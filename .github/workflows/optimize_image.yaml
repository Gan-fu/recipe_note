name: Optimize Images

on:
  push:
    paths:
      - "images/**"

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Convert images to WebP and delete originals (recursive)
        run: |
          # jpg/jpeg/png を再帰的に検索
          find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read file; do
            # 出力先（拡張子だけ変える）
            output="${file%.*}.webp"

            # WebP変換（画質80）
            cwebp -q 80 "$file" -o "$output"

            # 元画像削除
            rm "$file"
          done

      - name: Commit optimized images
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Optimize images to WebP and remove originals"
