name: Optimize Images

on:
  push:
    paths:
      - "images/**"

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install WebP and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Resize, convert to WebP, delete originals, and generate thumbnails
        run: |
          # JPG/PNG を再帰的に検索
          find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read file; do

            # リサイズ後の一時ファイル
            resized="${file%.*}-resized.jpg"

            # ---- ① リサイズ（長辺1200px） ----
            convert "$file" -resize 1200x1200\> "$resized"

            # ---- ② WebP 変換 ----
            output="${file%.*}.webp"
            cwebp -q 80 "$resized" -o "$output"

            # ---- ③ 元画像と一時ファイル削除 ----
            rm "$file"
            rm "$resized"

            # ---- ④ サムネイル生成（300px） ----
            dir=$(dirname "$file")
            thumb_dir="$dir/thumbs"
            mkdir -p "$thumb_dir"

            base=$(basename "${file%.*}")
            thumb_output="$thumb_dir/${base}-thumb.webp"

            convert "$output" -resize 300x300 "$thumb_output"
          done

      - name: Commit optimized images
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Resize images, convert to WebP, and generate thumbnails"
