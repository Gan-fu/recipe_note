name: Add created_at automatically

on:
  push:
    paths:
      - "recipes.json"

jobs:
  add_created_at:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Add created_at if missing
        run: |
          python3 - << 'EOF'
          import json
          from datetime import datetime

          # 今日の日付（YYYY-MM-DD）
          today = datetime.now().strftime("%Y-%m-%d")

          with open("recipes.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          updated = False

          for recipe in data["recipes"]:
              # created_at が無い or 空なら自動付与
              if "created_at" not in recipe or not recipe["created_at"]:
                  recipe["created_at"] = today
                  updated = True

          if updated:
              with open("recipes.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print("created_at を自動追加しました:", today)
          else:
              print("created_at の追加は不要でした。")
          EOF

      - name: Commit changes
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Add created_at automatically"
