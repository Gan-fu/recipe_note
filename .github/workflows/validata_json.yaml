name: Validate JSON

on:
  push:
    paths:
      - "recipes.json"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Validate JSON syntax
        run: |
          python3 - << 'EOF'
          import json
          import sys

          try:
              with open("recipes.json", "r", encoding="utf-8") as f:
                  json.load(f)
              print("JSON is valid.")
          except Exception as e:
              print("JSON validation failed:", e)
              sys.exit(1)
          EOF
